<!DOCTYPE html>

<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Add Product | FashionKart Admin</title>


    <!-- Bootstrap -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <!-- FashionKart CSS -->

    <link rel="stylesheet"
          th:href="@{/css/style.css}">

    <link rel="stylesheet"
          th:href="@{/css/admin.css}">

</head>


<body>


<div class="admin-dashboard">


    <!-- Sidebar -->

    <aside class="admin-sidebar">


        <div class="admin-sidebar-logo">

            FASHION<span>KART</span>

        </div>


        <p class="admin-sidebar-label">
            ADMIN PANEL
        </p>


        <nav class="admin-nav">


            <a th:href="@{/admin/dashboard}">

                Dashboard

            </a>


            <a th:href="@{/admin/products}"
               class="active">

                Products

            </a>


            <a th:href="@{/admin/orders}">

                Orders

            </a>


            <a th:href="@{/admin/users}">

                Users

            </a>


        </nav>


        <div class="admin-sidebar-bottom">


            <a th:href="@{/}">

                View Store

            </a>


           <form th:action="@{/logout(loginType='admin')}" method="post"  class="admin-logout-form">
			    <button type="submit">
			        Logout
			    </button>
			</form>


        </div>


    </aside>




    <!-- Main Content -->

    <main class="admin-main">


        <div class="admin-topbar">


            <div>

                <h1>
                    Add Product
                </h1>

                <p>
                    Add a new product to your FashionKart store
                </p>

            </div>


            <div class="admin-profile">

                Admin

            </div>


        </div>




        <!-- Product Form -->

        <div class="admin-section-card">


            <form th:action="@{/admin/products/add}"
      			  method="post"
      			  enctype="multipart/form-data">


                <!-- Basic Information -->

                <h2 class="admin-form-title">

                    Product Information

                </h2>


                <div class="row">


                    <div class="col-md-6 mb-3">

                        <label for="productName">

                            Product Name

                        </label>

                        <input
                            type="text"
                            id="productName"
                            name="productName"
                            class="form-control"
                            placeholder="Enter product name"
                            required>

                    </div>


                    <div class="col-md-6 mb-3">

                        <label for="sku">

                            SKU

                        </label>

                        <input
                            type="text"
                            id="sku"
                            name="sku"
                            class="form-control"
                            placeholder="Enter product SKU"
                            required>

                    </div>


                    <div class="col-md-6 mb-3">

                        <label for="brand">

                            Brand

                        </label>

                        <input
                            type="text"
                            id="brand"
                            name="brand"
                            class="form-control"
                            placeholder="Enter brand name">

                    </div>


                    <div class="col-md-6 mb-3">

                        <label for="category">

                            Category

                        </label>

                        <select
                            id="category"
                            name="category"
                            class="form-select"
                            required>

                            <option value="">

                                Select category

                            </option>

                            <option value="Women">

                                Women

                            </option>

                            <option value="Men">

                                Men

                            </option>

                            <option value="Kids">

                                Kids

                            </option>

                        </select>

                    </div>
                    
                    <div class="col-md-6 mb-3">

					    <label for="subCategory">
					        Subcategory
					    </label>
					
					    <select
					        id="subCategory"
					        name="subCategory"
					        class="form-select">
					
					        <option value="">
					   	         Select subcategory
					        </option>
					
					    </select>
					
					</div>


                    <div class="col-md-6 mb-3">

                        <label for="price">

                            Price

                        </label>

                        <input
                            type="number"
                            id="price"
                            name="price"
                            class="form-control"
                            placeholder="Enter price"
                            min="0"
                            required>

                    </div>


                    <div class="col-md-6 mb-3">

                        <label for="discount">

                            Discount (%)

                        </label>

                        <input
                            type="number"
                            id="discount"
                            name="discount"
                            class="form-control"
                            placeholder="Enter discount percentage"
                            min="0"
                            max="100"
                            value="0">

                    </div>


                    <div class="col-md-6 mb-3">

                        <label for="status">

                            Product Status

                        </label>

                        <select
                            id="status"
                            name="status"
                            class="form-select"
                            required>

                            <option value="Active">

                                Active

                            </option>

                            <option value="Inactive">

                                Inactive

                            </option>

                        </select>

                    </div>


                    <div class="col-md-6 mb-3">

                        <label for="color">

                            Color

                        </label>

                        <input
                            type="text"
                            id="color"
                            name="color"
                            class="form-control"
                            placeholder="Enter color">

                    </div>


                    <div class="col-12 mb-3">

                        <label for="description">

                            Description

                        </label>

                        <textarea
                            id="description"
                            name="description"
                            class="form-control"
                            rows="4"
                            placeholder="Enter product description"></textarea>

                    </div>


                </div>




                <!-- Sizes -->

                <h2 class="admin-form-title">
			    Available Sizes
			</h2>
			
			<div class="admin-size-options">
			
			    <label>
			        <input type="checkbox"
			               class="size-checkbox"
			               value="XS">
			        XS
			    </label>
			
			    <label>
			        <input type="checkbox"
			               class="size-checkbox"
			               value="S">
			        S
			    </label>
			
			    <label>
			        <input type="checkbox"
			               class="size-checkbox"
			               value="M">
			        M
			    </label>
			
			    <label>
			        <input type="checkbox"
			               class="size-checkbox"
			               value="L">
			        L
			    </label>
			
			    <label>
			        <input type="checkbox"
			               class="size-checkbox"
			               value="XL">
			        XL
			    </label>
			
			    <label>
			        <input type="checkbox"
			               class="size-checkbox"
			               value="XXL">
			        XXL
			    </label>
			
			</div>

			<div id="sizeStockContainer" class="mt-3"></div>




                <!-- Multiple Images -->

                <h2 class="admin-form-title">

                    Product Images

                </h2>


                <div class="admin-image-upload">


                    <label
                        for="productImages"
                        class="image-upload-label">


                        <span>+</span>


                        <strong>

                            Upload Product Images

                        </strong>


                        <small>

                            You can select multiple images

                        </small>


                    </label>


                    <input
                        type="file"
                        id="productImages"
                        name="productImages"
                        accept="image/*"
                        multiple>


                    <div
                        id="imagePreview"
                        class="admin-image-preview">
                    </div>


                </div>




                <!-- Buttons -->

                <div class="admin-form-actions">


                    <a
                        th:href="@{/admin/products}"
                        class="admin-cancel-btn">

                        Cancel

                    </a>


                    <button
                        type="submit"
                        class="admin-save-btn">

                        Add Product

                    </button>


                </div>


            </form>


        </div>


    </main>


</div>




<script>


const productImages =
    document.getElementById("productImages");

const imagePreview =
    document.getElementById("imagePreview");

let selectedFiles = [];


productImages.addEventListener("change", function () {

    const newFiles =
        Array.from(this.files);

    newFiles.forEach(function (file) {

        if (!file.type.startsWith("image/")) {
            return;
        }

        if (file.size > 5 * 1024 * 1024) {

            alert(
                file.name +
                " is larger than 5 MB and was not added."
            );

            return;
        }

        selectedFiles.push(file);
    });

    updateFileInput();

    displayImages();
});


function updateFileInput() {

    const dataTransfer =
        new DataTransfer();

    selectedFiles.forEach(function (file) {

        dataTransfer.items.add(file);

    });

    productImages.files =
        dataTransfer.files;
}


function displayImages() {

    imagePreview.innerHTML = "";

    selectedFiles.forEach(function (file, index) {

        const reader =
            new FileReader();

        reader.onload = function (event) {

            const imageBox =
                document.createElement("div");

            imageBox.className =
                "admin-preview-image";

            imageBox.innerHTML = `
                <img
                    src="${event.target.result}"
                    alt="Product Image">

                <button
                    type="button"
                    class="remove-preview-image"
                    onclick="removeImage(${index})">

                    ×

                </button>
            `;

            imagePreview.appendChild(imageBox);
        };

        reader.readAsDataURL(file);
    });
}


function removeImage(index) {

    selectedFiles.splice(index, 1);

    updateFileInput();

    displayImages();
}



    function displayImages() {


        imagePreview.innerHTML = "";


        selectedFiles.forEach(function (file, index) {


            const reader =
                new FileReader();


            reader.onload = function (event) {


                const imageBox =
                    document.createElement("div");


                imageBox.className =
                    "admin-preview-image";


                imageBox.innerHTML = `

                    <img
                        src="${event.target.result}"
                        alt="Product Image">

                    <button
                        type="button"
                        class="remove-preview-image"
                        onclick="removeImage(${index})">

                        ×

                    </button>

                `;


                imagePreview.appendChild(imageBox);

            };


            reader.readAsDataURL(file);

        });

    }



    function removeImage(index) {

        selectedFiles.splice(index, 1);

        displayImages();

    }
    
    const sizeCheckboxes =
        document.querySelectorAll(".size-checkbox");

    const sizeStockContainer =
        document.getElementById("sizeStockContainer");


    sizeCheckboxes.forEach(function (checkbox) {

        checkbox.addEventListener("change", function () {

            updateSizeStockFields();

        });

    });


    function updateSizeStockFields() {

        sizeStockContainer.innerHTML = "";

        sizeCheckboxes.forEach(function (checkbox) {

            if (checkbox.checked) {

                const size = checkbox.value;

                const sizeRow =
                    document.createElement("div");

                sizeRow.className =
                    "row align-items-center mb-2";

                sizeRow.innerHTML = `
                    <div class="col-md-3">
                        <label class="form-label">
                            ${size} Stock
                        </label>
                    </div>

                    <div class="col-md-4">
                        <input
                            type="number"
                            class="form-control size-stock"
                            name="sizeStock_${size}"
                            data-size="${size}"
                            min="0"
                            placeholder="Enter ${size} stock"
                            required>
                    </div>
                `;

                sizeStockContainer.appendChild(sizeRow);
            }

        });
    }
    
    const categorySelect =
        document.getElementById("category");

    const subCategorySelect =
        document.getElementById("subCategory");


    const subCategories = {

        Women: [
            "Dresses",
            "Tops",
            "Jeans",
            "Skirts",
            "Trousers",
            "Ethnic Wear"
        ],

        Men: [
            "Shirts",
            "T-Shirts",
            "Jeans",
            "Trousers",
            "Kurtas",
            "Jackets"
        ],

        Kids: [
            "Dresses",
            "T-Shirts",
            "Jeans",
            "Trousers",
            "Ethnic Wear",
            "Jackets"
        ]

    };


    categorySelect.addEventListener("change", function () {

        const selectedCategory = this.value;

        subCategorySelect.innerHTML =
            '<option value="">Select subcategory</option>';


        if (subCategories[selectedCategory]) {

            subCategories[selectedCategory].forEach(function (subCategory) {

                const option =
                    document.createElement("option");

                option.value = subCategory;
                option.textContent = subCategory;

                subCategorySelect.appendChild(option);

            });

        }

    });


</script>


</body>

</html>
