<!DOCTYPE html>

<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Edit Product | FashionKart Admin</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">

<!-- Main CSS -->
<link rel="stylesheet"
      th:href="@{/css/style.css}">

<!-- Admin CSS -->
<link rel="stylesheet"
      th:href="@{/css/admin.css}">

</head>

<body>

<div class="admin-dashboard">

<!-- Sidebar -->

<aside class="admin-sidebar">

    <div class="admin-sidebar-logo">
        FASHION<span>KART</span>
    </div>

    <p class="admin-sidebar-label">
        ADMIN PANEL
    </p>

    <nav class="admin-nav">

        <a th:href="@{/admin/dashboard}">
            Dashboard
        </a>

        <a th:href="@{/admin/products}"
           class="active">
            Products
        </a>

        <a th:href="@{/admin/orders}">
            Orders
        </a>

        <a th:href="@{/admin/users}">
            Users
        </a>

    </nav>

    <div class="admin-sidebar-bottom">

        <a th:href="@{/}">
            View Store
        </a>

        <form th:action="@{/logout(loginType='admin')}"
              method="post"
              class="admin-logout-form">

            <button type="submit">
                Logout
            </button>

        </form>

    </div>

</aside>


<!-- Main Content -->

<main class="admin-main">

    <!-- Top Bar -->

    <div class="admin-topbar">

        <div>

            <h1>
                Edit Product
            </h1>

            <p>
                Update product information
            </p>

        </div>

        <div class="admin-profile">
            Admin
        </div>

    </div>


    <!-- Product Form -->

    <div class="admin-section-card">

        <form th:action="@{/admin/products/update}"
              method="post"
              enctype="multipart/form-data">

            <input type="hidden"
                   name="id"
                   th:value="${product.id}">


            <!-- Product Information -->

            <h2 class="admin-form-title">
                Product Information
            </h2>


            <div class="row">

                <!-- Product Name -->

                <div class="col-md-6 mb-3">

                    <label for="productName">
                        Product Name
                    </label>

                    <input type="text"
                           id="productName"
                           name="productName"
                           class="form-control"
                           th:value="${product.productName}"
                           required>

                </div>


                <!-- SKU -->

                <div class="col-md-6 mb-3">

                    <label for="sku">
                        SKU
                    </label>

                    <input type="text"
                           id="sku"
                           name="sku"
                           class="form-control"
                           th:value="${product.sku}"
                           required>

                </div>


                <!-- Brand -->

                <div class="col-md-6 mb-3">

                    <label for="brand">
                        Brand
                    </label>

                    <input type="text"
                           id="brand"
                           name="brand"
                           class="form-control"
                           th:value="${product.brand}">

                </div>


                <!-- Category -->

                <div class="col-md-6 mb-3">

                    <label for="category">
                        Category
                    </label>

                    <select id="category"
                            name="category"
                            class="form-select"
                            required>

                        <option value="Women"
                                th:selected="${product.category == 'Women'}">
                            Women
                        </option>

                        <option value="Men"
                                th:selected="${product.category == 'Men'}">
                            Men
                        </option>

                        <option value="Kids"
                                th:selected="${product.category == 'Kids'}">
                            Kids
                        </option>

                    </select>

                </div>


                <!-- Sub Category -->

                <div class="col-md-6 mb-3">

                    <label for="subCategory">
                        Subcategory
                    </label>

                    <select id="subCategory"
                            name="subCategory"
                            class="form-select">

                        <option value="">
                            Select subcategory
                        </option>

                    </select>

                </div>


                <!-- Price -->

                <div class="col-md-6 mb-3">

                    <label for="price">
                        Price
                    </label>

                    <input type="number"
                           id="price"
                           name="price"
                           class="form-control"
                           th:value="${product.price}"
                           min="0"
                           required>

                </div>


                <!-- Discount -->

                <div class="col-md-6 mb-3">

                    <label for="discount">
                        Discount (%)
                    </label>

                    <input type="number"
                           id="discount"
                           name="discount"
                           class="form-control"
                           th:value="${product.discount}"
                           min="0"
                           max="100">

                </div>


                <!-- Status -->

                <div class="col-md-6 mb-3">

                    <label for="status">
                        Product Status
                    </label>

                    <select id="status"
                            name="status"
                            class="form-select"
                            required>

                        <option value="Active"
                                th:selected="${product.active}">
                            Active
                        </option>

                        <option value="Inactive"
                                th:selected="${!product.active}">
                            Inactive
                        </option>

                    </select>

                </div>


                <!-- Color -->

                <div class="col-md-6 mb-3">

                    <label for="color">
                        Color
                    </label>

                    <input type="text"
                           id="color"
                           name="color"
                           class="form-control"
                           th:value="${product.color}">

                </div>


                <!-- Description -->

                <div class="col-12 mb-3">

                    <label for="description">
                        Description
                    </label>

                    <textarea id="description"
                              name="description"
                              class="form-control"
                              rows="4"
                              th:text="${product.description}"></textarea>

                </div>

            </div>


            <!-- Available Sizes -->

            <h2 class="admin-form-title">
                Available Sizes
            </h2>

            <div class="admin-size-options">

                <label th:each="sizeOption : ${availableSizes}">

                    <input type="checkbox"
                           class="size-checkbox"
                           name="selectedSizes"
                           th:value="${sizeOption}"
                           th:checked="${#lists.contains(product.sizes.![size], sizeOption)}">

                    <span th:text="${sizeOption}"></span>

                </label>

            </div>


            <div id="sizeStockContainer"
                 class="mt-3">

                <div th:each="size : ${product.sizes}"
                     class="row align-items-center mb-2">

                    <div class="col-md-3">

                        <label class="form-label"
                               th:text="${size.size + ' Stock'}">
                        </label>

                    </div>

                    <div class="col-md-4">

                        <input type="number"
                               class="form-control size-stock"
                               th:name="'sizeStock_' + ${size.size}"
                               th:value="${size.stockQuantity}"
                               th:data-size="${size.size}"
                               min="0"
                               th:placeholder="'Enter ' + ${size.size} + ' stock'"
                               required>

                    </div>

                </div>

            </div>


            <!-- Product Images -->

            <h2 class="admin-form-title">
                Product Images
            </h2>

            <div class="admin-image-upload">

                <label for="productImages"
                       class="image-upload-label">

                    <span>+</span>

                    <strong>
                        Add Product Images
                    </strong>

                    <small>
                        You can select multiple images
                    </small>

                </label>

                <input type="file"
                       id="productImages"
                       name="productImages"
                       accept="image/*"
                       multiple>

            </div>


            <!-- Existing Product Images -->

            <h2 class="admin-form-title">
                Existing Product Images
            </h2>

            <div class="admin-existing-images">

                <div class="admin-existing-image"
                     th:each="image : ${product.images}"
                     th:data-image-id="${image.id}">

                    <img th:src="@{${image.imagePath}}"
                         alt="Product Image">

                    <button type="button"
                            class="remove-existing-image"
                            th:data-image-id="${image.id}"
                            th:data-product-id="${product.id}"
                            onclick="removeExistingImage(this)">

                        ×

                    </button>

                </div>

            </div>


            <!-- Image Preview -->

            <div id="imagePreview"
                 class="admin-image-preview">
            </div>


            <!-- Form Buttons -->

            <div class="admin-form-actions">

                <a th:href="@{/admin/products}"
                   class="admin-cancel-btn">

                    Cancel

                </a>

                <button type="submit"
                        class="admin-save-btn">

                    Update Product

                </button>

            </div>

        </form>

    </div>

</main>
```

</div>

<!-- JavaScript -->

<script>

    const productImages =
        document.getElementById("productImages");

    const imagePreview =
        document.getElementById("imagePreview");

    let selectedFiles = [];


    productImages.addEventListener("change", function () {

        const newFiles =
            Array.from(this.files);

        newFiles.forEach(function (file) {

            if (!file.type.startsWith("image/")) {
                return;
            }

            if (file.size > 5 * 1024 * 1024) {

                alert(
                    file.name +
                    " is larger than 5 MB and was not added."
                );

                return;
            }

            selectedFiles.push(file);

        });

        displayImages();

    });


    function displayImages() {

        imagePreview.innerHTML = "";

        selectedFiles.forEach(function (file, index) {

            const reader =
                new FileReader();

            reader.onload = function (event) {

                const imageBox =
                    document.createElement("div");

                imageBox.className =
                    "admin-preview-image";

                imageBox.innerHTML = `

                    <img src="${event.target.result}"
                         alt="Product Image">

                    <button type="button"
                            class="remove-preview-image"
                            onclick="removeImage(${index})">

                        ×

                    </button>

                `;

                imagePreview.appendChild(imageBox);

            };

            reader.readAsDataURL(file);

        });

    }


    function removeImage(index) {

        selectedFiles.splice(index, 1);

        displayImages();

    }


    function removeExistingImage(button) {

        const imageId =
            button.getAttribute("data-image-id");

        const productId =
            button.getAttribute("data-product-id");

        const form =
            document.createElement("form");

        form.method = "POST";

        form.action =
            "/FashionKart/admin/products/image/delete";


        const imageInput =
            document.createElement("input");

        imageInput.type = "hidden";

        imageInput.name = "imageId";

        imageInput.value = imageId;


        const productInput =
            document.createElement("input");

        productInput.type = "hidden";

        productInput.name = "productId";

        productInput.value = productId;


        const csrfToken =
            document.querySelector(
                'input[name="_csrf"]'
            );


        if (csrfToken) {

            const csrfInput =
                document.createElement("input");

            csrfInput.type = "hidden";

            csrfInput.name = "_csrf";

            csrfInput.value =
                csrfToken.value;

            form.appendChild(csrfInput);

        }


        form.appendChild(imageInput);

        form.appendChild(productInput);

        document.body.appendChild(form);

        form.submit();

    }


    /* ================================
       SIZE STOCK MANAGEMENT
       ================================ */

    const sizeCheckboxes =
        document.querySelectorAll(".size-checkbox");

    const sizeStockContainer =
        document.getElementById("sizeStockContainer");


    sizeCheckboxes.forEach(function (checkbox) {

        checkbox.addEventListener("change", function () {

            updateSizeStockFields();

        });

    });


    function updateSizeStockFields() {

        sizeCheckboxes.forEach(function (checkbox) {

            const size =
                checkbox.value;

            const existingStockInput =
                document.querySelector(
                    'input[name="sizeStock_' + size + '"]'
                );


            if (checkbox.checked &&
                !existingStockInput) {

                const sizeRow =
                    document.createElement("div");

                sizeRow.className =
                    "row align-items-center mb-2";


                sizeRow.innerHTML = `

                    <div class="col-md-3">

                        <label class="form-label">

                            ${size} Stock

                        </label>

                    </div>


                    <div class="col-md-4">

                        <input
                            type="number"
                            class="form-control size-stock"
                            name="sizeStock_${size}"
                            data-size="${size}"
                            min="0"
                            placeholder="Enter ${size} stock"
                            required>

                    </div>

                `;

                sizeStockContainer.appendChild(sizeRow);

            }

            else if (!checkbox.checked &&
                     existingStockInput) {

                existingStockInput
                    .closest(".row")
                    .remove();

            }

        });

    }


    /* ================================
       CATEGORY / SUBCATEGORY
       ================================ */

    const categorySelect =
        document.getElementById("category");

    const subCategorySelect =
        document.getElementById("subCategory");


    const currentSubCategory =
        "[[${product.subCategory}]]";


    const subCategories = {

        Women: [

            "Dresses",
            "Tops",
            "Jeans",
            "Skirts",
            "Trousers",
            "Ethnic Wear"

        ],

        Men: [

            "Shirts",
            "T-Shirts",
            "Jeans",
            "Trousers",
            "Kurtas",
            "Jackets"

        ],

        Kids: [

            "Dresses",
            "T-Shirts",
            "Jeans",
            "Trousers",
            "Ethnic Wear",
            "Jackets"

        ]

    };


    function updateSubCategories() {

        const selectedCategory =
            categorySelect.value;


        subCategorySelect.innerHTML =
            '<option value="">Select subcategory</option>';


        if (subCategories[selectedCategory]) {

            subCategories[selectedCategory].forEach(
                function (subCategory) {

                    const option =
                        document.createElement("option");

                    option.value =
                        subCategory;

                    option.textContent =
                        subCategory;


                    if (subCategory === currentSubCategory) {

                        option.selected =
                            true;

                    }


                    subCategorySelect.appendChild(option);

                }
            );

        }

    }


    categorySelect.addEventListener(
        "change",
        updateSubCategories
    );


    updateSubCategories();

</script>

</body>

</html>
