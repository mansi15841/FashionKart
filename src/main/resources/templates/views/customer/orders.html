<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Orders | FashionKart</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/style.css}">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Satisfy&display=swap"
        rel="stylesheet">
</head>

<body>

    <div th:replace="~{fragments/navbar :: navbar}"></div>
    
    
		<!-- Order success message -->
		<div class="container mt-2"
		     th:if="${successMessage != null}">
		    <div class="alert alert-success alert-dismissible fade show"
		         role="alert">
		        <strong>Order Placed Successfully!</strong>
		        <span th:text="${successMessage}"></span>
		
		        <button type="button"
		                class="btn-close"
		                data-bs-dismiss="alert"
		                aria-label="Close"></button>
		    </div>
		</div>

    <section class="orders-section">
        <div class="container">

            <!-- Small corner heading -->
            <div class="orders-heading">
                <p class="section-subtitle">MY ORDERS</p>
            </div>

            <div th:if="${errorMessage}"
                 class="alert alert-danger"
                 role="alert"
                 th:text="${errorMessage}">
            </div>

            <!-- Empty orders state -->
            <div class="orders-empty-state"
                 th:if="${#lists.isEmpty(orders)}">

                <p>You haven't placed any orders yet.</p>

                <a th:href="@{/shop}" class="btn btn-dark">
                    Continue Shopping
                </a>
            </div>

			<!-- Actual orders from database -->
			<div class="orders-list"
			     th:unless="${#lists.isEmpty(orders)}">
			
			    <a class="order-card order-card-link"
			       th:each="order : ${orders}"
			       th:href="@{/order-details(id=${order.id})}">
			
			        <!-- Order ID -->
					<div class="order-header">
					    <p class="order-label">ORDER ID:</p>
					    <h3 th:text="${order.orderNumber}">FK123456</h3>
					</div>
			        
			
			        <!-- Product thumbnail and information -->
			        <div class="order-body"
			             th:if="${!#lists.isEmpty(order.items)}">
			
			            <!-- Product image -->
			            <div class="order-product-image">
			
			                <img th:if="${order.items[0].productImage != null
			                              and !#strings.isEmpty(order.items[0].productImage)}"
			                     th:src="@{${order.items[0].productImage}}"
			                     th:alt="${order.items[0].productName}">
			
			                <span th:if="${order.items[0].productImage == null
			                              or #strings.isEmpty(order.items[0].productImage)}">
			                    No Image
			                </span>
			
			            </div>
			
			            <!-- Brand, product name, size and quantity -->
			            <div class="order-product-info">
			
			                <p class="order-category"
			                   th:text="${order.items[0].product.brand}">
			                    Brand
			                </p>
			
			                <h3 th:text="${order.items[0].productName}">
			                    Product Name
			                </h3>
			
			                <p>
			                    Size:
			                    <span th:text="${order.items[0].size ?: 'N/A'}">M</span>
			                </p>
			
			                <p>
			                    Quantity:
			                    <span th:text="${order.items[0].quantity}">1</span>
			                </p>
			
			            </div>
			        </div>
			        
			        <!-- Delivery Status -->
					<div class="order-delivery-status">
					    <span class="delivery-status-label">DELIVERY STATUS</span>
					    <span class="delivery-status-value"
					          th:text="${order.orderStatus}">Processing</span>
					</div>
			
			    </a>
			</div>

            

        </div>
    </section>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>
</html>
