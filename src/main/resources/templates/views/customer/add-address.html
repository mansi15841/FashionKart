<!DOCTYPE html>

<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>FashionKart - Add Address</title>

<!-- Bootstrap -->
<link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">

<!-- FashionKart CSS -->
<link rel="stylesheet"
      href="css/style.css">

<link rel="preconnect" href="https://fonts.googleapis.com"> 
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin> 

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Satisfy&display=swap" 
	rel="stylesheet">
      
</head>

<body>

<!-- Navbar -->
<div th:replace="~{fragments/navbar :: navbar}"></div>

<!-- ==============================
     Add Address Section
     ============================== -->

<section class="address-section">

<div class="container">

    <div class="address-heading">

        <p class="section-subtitle">
            DELIVERY
        </p>

        <h1 class="section-title">
            Add New Address
        </h1>

        <p class="section-description">

            Add a delivery address for your FashionKart orders.

        </p>

    </div>


    <div class="address-container">

        <div class="address-box">
		
		<form th:action="@{/profile/address/save}" method="post">

            <!-- Address Type -->

            <div class="address-form-group">

                <label>
                    Address Type
                </label>

                <div class="address-type-options">

                    <label class="address-type-option">

                        <input type="radio"
                               name="addressType"
                               value="home"
                               checked>

                        <span>
                            Home
                        </span>

                    </label>


                    <label class="address-type-option">

                        <input type="radio"
                               name="addressType"
                               value="office">

                        <span>
                            Office
                        </span>

                    </label>

                </div>

            </div>


            <!-- Full Name -->

            <div class="address-form-group">

                <label for="fullName">

                    Full Name

                </label>

                <input type="text"
                       id="fullName"
                       name="fullName"
                       placeholder="Enter your full name">

            </div>


            <!-- Phone -->

            <div class="address-form-group">

                <label for="phone">

                    Phone Number

                </label>

                <input type="tel"
                       id="phone"
                       name="phone"
                       placeholder="Enter your phone number">

            </div>


            <!-- Address -->

            <div class="address-form-group">

                <label for="address">

                    Address

                </label>

                <textarea id="address"
                		  name="address"
                          rows="3"
                          placeholder="House No., Street, Area"></textarea>

            </div>


            <!-- City and State -->

            <div class="row">

                <div class="col-md-6">

                    <div class="address-form-group">

                        <label for="city">

                            City

                        </label>

                        <input type="text"
                               id="city"
                               name="city"
                               placeholder="Enter city">

                    </div>

                </div>


                <div class="col-md-6">

                    <div class="address-form-group">

                        <label for="state">

                            State

                        </label>

                        <input type="text"
                               id="state"
                               name="state"
                               placeholder="Enter state">

                    </div>

                </div>

            </div>


            <!-- Pincode -->

            <div class="address-form-group">

                <label for="pincode">

                    Pincode

                </label>

                <input type="text"
                       id="pincode"
                       name="pincode"
                       placeholder="Enter 6-digit pincode">

            </div>


            <!-- Default Address -->

            <div class="default-address">

                <input type="checkbox"
                       id="defaultAddress"
                       name="defaultAddress">

                <label for="defaultAddress">

                    Make this my default delivery address

                </label>

            </div>


            <!-- Buttons -->

            <div class="address-buttons">

                <a th:href="@{/profile}"
                   class="cancel-address-btn">

                    Cancel

                </a>

                <button type="submit"
                        class="save-address-btn">

                    Save Address

                </button>

            </div>
            
            </form>


        </div>

    </div>

</div>


</section>

<!-- ==============================
     JavaScript
     ============================== -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>

</html>
