f<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>FashionKart - Login</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- FashionKart CSS -->
    <link
        rel="stylesheet"
        th:href="@{/css/style.css}">

</head>

<body>

<!-- ================= LOGIN SECTION ================= -->

<section class="login-section">

    <div class="container">

        <div class="login-container">

            <div class="login-box">
            

                <p class="section-subtitle">
                    WELCOME BACK
                </p>

                <h1>
                    Login to FashionKart
                </h1>

                <p class="login-description">
                    Sign in to access your account and continue
                    shopping your favorite styles.
                </p>


                <!-- Success Message -->

                <div
                    th:if="${successMessage}"
                    class="register-success-message"
                    th:text="${successMessage}">
                </div>


                <!-- Login Form -->

                <form
                    id="loginForm"
                    th:action="@{/login}"
                    method="post">


                    <!-- Error Message -->

                    <div
					    th:if="${error}"
					    class="register-error-message"
					    th:text="${error}">
					</div>


                    <!-- Email -->

                    <div class="login-form-group">

                        <label for="email">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your email"
                            required>

                    </div>


                    <!-- Password -->

                    <div class="login-form-group">

                        <label for="password">
                            Password
                        </label>

                        <div class="password-wrapper">

                            <input
                                type="password"
                                id="password"
                                name="password"
                                placeholder="Enter your password"
                                required>

                            <span
                                class="password-eye"
                                onclick="togglePassword('password', this)">

                                <i class="bi bi-eye-slash"></i>

                            </span>

                        </div>

                    </div>


                    <!-- Remember + Forgot -->

                    <div class="login-options">

                        <div>

                            <input
                                type="checkbox"
                                id="remember">

                            <label for="remember">
                                Remember me
                            </label>

                        </div>

                        <a href="#">
                            Forgot Password?
                        </a>

                    </div>


                    <!-- Login Button -->

                    <button
                        type="submit"
                        class="login-btn">

                        Login

                    </button>

                </form>


                <!-- Register -->

                <p class="register-text">

                    Don't have an account?

                    <a th:href="@{/register}">
                        Create Account
                    </a>

                </p>

            </div>

        </div>

    </div>

</section>


<!-- Bootstrap JavaScript -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


<!-- Login JavaScript -->

<script>

    function togglePassword(inputId, eye) {

        const input =
            document.getElementById(inputId);

        const icon =
            eye.querySelector("i");


        if (input.type === "password") {

            // Show password

            input.type = "text";

            icon.classList.remove("bi-eye-slash");

            icon.classList.add("bi-eye");

        } else {

            // Hide password

            input.type = "password";

            icon.classList.remove("bi-eye");

            icon.classList.add("bi-eye-slash");

        }

    }

</script>

</body>

</html>
