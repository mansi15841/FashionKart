<!DOCTYPE html>

<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>FashionKart - Register</title>

<!-- Bootstrap -->
<link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">

<!-- Bootstrap Icons -->
<link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<!-- FashionKart CSS -->
<link rel="stylesheet"
      th:href="@{/css/style.css}">

</head>

<body>

<!-- ================= REGISTER SECTION ================= -->

<section class="register-section">

<div class="container">

    <div class="register-container">

        <div class="register-box">

            <p class="section-subtitle">
                JOIN FASHIONKART
            </p>

            <!-- Success Message -->
            <div
                th:if="${successMessage}"
                class="success-message"
                th:text="${successMessage}">
            </div>

            <!-- Error Message -->
            <div
                th:if="${errorMessage}"
                class="register-error-message"
                th:text="${errorMessage}">
            </div>

            <h1>
                Create Your Account
            </h1>

            <p class="register-description">
                Create an account and start exploring
                the latest fashion styles.
            </p>

            <!-- ================= REGISTRATION FORM ================= -->

            <form
                id="registerForm"
                th:action="@{/register}"
                th:object="${registerRequest}"
                method="post"
                novalidate>

                <!-- Full Name -->

                <div class="register-form-group">

                    <label for="fullName">
                        Full Name
                    </label>

                    <span
                        class="required-message"
                        id="fullNameError">
                        This field is required
                    </span>

                    <input
                        type="text"
                        id="fullName"
                        th:field="*{fullName}"
                        placeholder="Enter your full name">

                </div>


                <!-- Email -->

                <div class="register-form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <span
                        class="required-message"
                        id="emailError">
                        This field is required
                    </span>

                    <input
                        type="email"
                        id="email"
                        th:field="*{email}"
                        placeholder="Enter your email">

                </div>


                <!-- Contact -->

                <div class="register-form-group">

                    <label for="contact">
                        Contact
                    </label>

                    <span
                        class="required-message"
                        id="contactError">
                        This field is required
                    </span>

                    <div class="phone-input">

                        <span class="country-code">
                            +91
                        </span>

                        <input
                            type="tel"
                            id="contact"
                            th:field="*{contact}"
                            placeholder="Enter 10 digit mobile number"
                            maxlength="10">

                    </div>

                </div>


                <!-- Password -->

                <div class="register-form-group">

                    <label for="password">
                        Password
                    </label>

                    <span
                        class="required-message"
                        id="passwordError">
                        This field is required
                    </span>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="password"
                            th:field="*{password}"
                            placeholder="Create a password">

                        <span
                            class="password-eye"
                            onclick="togglePassword('password', this)">

                            <i class="bi bi-eye-slash"></i>

                        </span>

                    </div>

                </div>


                <!-- Confirm Password -->

                <div class="register-form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <span
                        class="required-message"
                        id="confirmPasswordError">
                        This field is required
                    </span>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="confirmPassword"
                            th:field="*{confirmPassword}"
                            placeholder="Confirm your password">

                        <span
                            class="password-eye"
                            onclick="togglePassword('confirmPassword', this)">

                            <i class="bi bi-eye-slash"></i>

                        </span>

                    </div>

                </div>


                <!-- Gender -->

                <div class="register-form-group">

                    <label for="gender">
                        Gender
                    </label>

                    <select
                        id="gender"
                        th:field="*{gender}"
                        required>

                        <option value="" disabled selected>
                            Select Gender
                        </option>

                        <option value="Male">
                            Male
                        </option>

                        <option value="Female">
                            Female
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>

                    <small
                        class="error"
                        id="genderError">
                    </small>

                </div>


                <!-- Terms -->

                <div class="register-terms">

                    <input
                        type="checkbox"
                        id="terms">

                    <label for="terms">
                        I agree to the Terms & Conditions
                    </label>

                </div>


                <!-- Register Button -->

                <button
                    type="submit"
                    class="register-btn">

                    Create Account

                </button>

            </form>


            <!-- Login Link -->

            <p class="login-text">

                Already have an account?

                <a th:href="@{/login}">
                    Login
                </a>

            </p>

        </div>

    </div>

</div>

</section>

<!-- Bootstrap JavaScript -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

<!-- ================= REGISTRATION VALIDATION ================= -->

<script>

    const form =
        document.getElementById("registerForm");


    const fields = [

        {
            input: "fullName",
            error: "fullNameError"
        },

        {
            input: "contact",
            error: "contactError"
        },

        {
            input: "password",
            error: "passwordError"
        },

        {
            input: "confirmPassword",
            error: "confirmPasswordError"
        },

        {
            input: "email",
            error: "emailError"
        }

    ];


    // Hide error messages initially

    fields.forEach(function(field) {

        document
            .getElementById(field.error)
            .style.display = "none";

    });


    document
        .getElementById("genderError")
        .style.display = "none";


    // Form validation

    form.addEventListener("submit", function(event) {

        let isValid = true;


        // Required field validation

        fields.forEach(function(field) {

            const input =
                document.getElementById(field.input);

            const error =
                document.getElementById(field.error);


            if (input.value.trim() === "") {

                error.style.display = "block";

                input.classList.add("error");

                isValid = false;

            } else {

                error.style.display = "none";

                input.classList.remove("error");

            }

        });


        // Gender validation

        const gender =
            document.getElementById("gender");

        const genderError =
            document.getElementById("genderError");


        if (gender.value === "") {

            genderError.textContent =
                "Gender is required";

            genderError.style.display =
                "block";

            gender.classList.add("error");

            isValid = false;

        } else {

            genderError.style.display =
                "none";

            gender.classList.remove("error");

        }


        // Contact validation

        const contact =
            document.getElementById("contact");

        const contactError =
            document.getElementById("contactError");


        if (!/^\d{10}$/.test(contact.value.trim())) {

            contactError.textContent =
                "Enter a valid 10-digit contact number";

            contactError.style.display =
                "block";

            contact.classList.add("error");

            isValid = false;

        }


        // Password confirmation

        const password =
            document.getElementById("password");

        const confirmPassword =
            document.getElementById("confirmPassword");

        const confirmPasswordError =
            document.getElementById("confirmPasswordError");


        if (
            confirmPassword.value.trim() !== "" &&
            password.value !== confirmPassword.value
        ) {

            confirmPasswordError.textContent =
                "Passwords do not match";

            confirmPasswordError.style.display =
                "block";

            confirmPassword.classList.add("error");

            isValid = false;

        }


        // Terms validation

        const terms =
            document.getElementById("terms");


        if (!terms.checked) {

            alert(
                "Please agree to the Terms & Conditions."
            );

            isValid = false;

        }


        /*
         * If validation fails, stop form submission.
         *
         * If validation succeeds, allow the form
         * to submit normally to Spring Boot.
         */

        if (!isValid) {

            event.preventDefault();

        }

    });


    // Remove error while typing

    fields.forEach(function(field) {

        const input =
            document.getElementById(field.input);

        const error =
            document.getElementById(field.error);


        input.addEventListener("input", function() {

            if (input.value.trim() !== "") {

                error.style.display = "none";

                input.classList.remove("error");

            }

        });

    });


    // Remove gender error when selected

    document
        .getElementById("gender")
        .addEventListener("change", function() {

            document
                .getElementById("genderError")
                .style.display = "none";

            this.classList.remove("error");

        });


    // Show / Hide Password

   function togglePassword(inputId, eye) {

    const input = document.getElementById(inputId);
    const icon = eye.querySelector("i");

    if (input.type === "password") {

        // Show password
        input.type = "text";

        icon.classList.remove("bi-eye-slash");
        icon.classList.add("bi-eye");

    } else {

        // Hide password
        input.type = "password";

        icon.classList.remove("bi-eye");
        icon.classList.add("bi-eye-slash");
    }
}

</script>

</body>

</html>
